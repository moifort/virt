<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>VIRT — Les Jardins de Sable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2b2533;
        --paper: #f7ecd4;
        --red: #c9443c;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f8d3a8;
        font-family: 'Pixelify Sans', monospace;
        color: var(--ink);
        user-select: none;
        /* The page itself never zooms: pinching zooms the map (see main.js). */
        touch-action: none;
      }
      canvas {
        display: block;
        cursor: grab;
        image-rendering: pixelated;
      }
      canvas:active {
        cursor: grabbing;
      }

      /* The little controls along the bottom right: the weather (weather.js) and the season
         (season.js), each spreading a fan of choices, and the day / night switch (daynight.js), a
         strip of sky with the sun or the moon on it. Soft shadows lift them off the picture; no
         hard ink around them. */
      .daynight,
      .season,
      .weather,
      .fan-chip {
        position: fixed;
        bottom: 16px;
        z-index: 10;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 15px;
        overflow: hidden;
        background: none;
        box-shadow:
          0 1px 2px rgba(43, 37, 51, 0.18),
          0 5px 12px rgba(43, 37, 51, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          inset 0 -1px 0 rgba(43, 37, 51, 0.12);
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .daynight {
        right: 16px;
        width: 64px;
      }
      .season {
        right: 90px;
        width: 34px;
      }
      .weather {
        right: 134px;
        width: 34px;
      }
      .daynight:hover,
      .season:hover,
      .weather:hover,
      .fan-chip:hover {
        transform: translateY(-1px);
        box-shadow:
          0 2px 3px rgba(43, 37, 51, 0.16),
          0 8px 18px rgba(43, 37, 51, 0.26),
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          inset 0 -1px 0 rgba(43, 37, 51, 0.12);
      }
      .daynight:active,
      .season:active,
      .weather:active,
      .fan-chip:active {
        transform: translateY(1px);
        box-shadow:
          0 1px 1px rgba(43, 37, 51, 0.18),
          0 2px 5px rgba(43, 37, 51, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          inset 0 -1px 0 rgba(43, 37, 51, 0.12);
      }
      .daynight:focus-visible,
      .season:focus-visible,
      .weather:focus-visible,
      .fan-chip:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 2px;
      }
      .daynight i {
        position: absolute;
        display: block;
      }
      .daynight-sky {
        position: absolute;
        inset: 0;
        background: linear-gradient(#7fcdf4, #a9e2fa);
        transition: background 0.8s;
      }
      .is-night .daynight-sky {
        background: linear-gradient(#1f2656, #3a4486);
      }
      .daynight .star {
        width: 2px;
        height: 2px;
        background: #fff6d5;
        opacity: 0;
        transition: opacity 0.8s;
      }
      .is-night .star {
        opacity: 1;
        animation: daynight-twinkle 1.8s steps(2) infinite;
      }
      .daynight .cloud {
        width: 10px;
        height: 4px;
        background: #fff;
        box-shadow: 3px -2px 0 #fff, -2px 1px 0 #fff;
        transition: opacity 0.6s;
        animation: daynight-drift 5s ease-in-out infinite alternate;
      }
      .is-night .cloud {
        opacity: 0;
      }
      .daynight-knob {
        position: absolute;
        top: 2px;
        left: 3px;
        width: 22px;
        height: 22px;
        transition: left 0.5s cubic-bezier(0.5, 1.6, 0.4, 0.8);
      }
      .is-night .daynight-knob {
        left: 35px;
      }
      .daynight .sun,
      .daynight .moon {
        inset: 0;
        border-radius: 50%;
        transition: opacity 0.4s, transform 0.5s;
      }
      .daynight .sun {
        background: radial-gradient(circle, #ffd23f 0 6px, transparent 6.5px),
          repeating-conic-gradient(#ffb703 0 15deg, transparent 15deg 45deg);
        animation: daynight-spin 8s linear infinite;
      }
      .daynight .moon {
        inset: 4px;
        background: radial-gradient(circle at 35% 40%, #d9d3b8 0 2px, transparent 2.5px),
          radial-gradient(circle at 65% 68%, #d9d3b8 0 1.5px, transparent 2px), #fff6d5;
        opacity: 0;
        transform: rotate(-90deg) scale(0.4);
        animation: daynight-glow 2.4s ease-in-out infinite alternate;
      }
      .is-night .sun {
        opacity: 0;
        transform: rotate(90deg) scale(0.4);
      }
      .is-night .moon {
        opacity: 1;
        transform: none;
      }
      @keyframes daynight-spin {
        to {
          rotate: 360deg;
        }
      }
      @keyframes daynight-glow {
        from {
          box-shadow: 0 0 2px 1px rgba(255, 246, 213, 0.3);
        }
        to {
          box-shadow: 0 0 6px 2px rgba(255, 246, 213, 0.6);
        }
      }
      @keyframes daynight-twinkle {
        50% {
          opacity: 0.3;
        }
      }
      @keyframes daynight-drift {
        to {
          translate: -6px 0;
        }
      }

      .season-pic,
      .season-pic span,
      .season-pic i {
        position: absolute;
        display: block;
      }
      .season-pic {
        inset: 0;
      }
      .season-sky {
        inset: 0;
        background: linear-gradient(#7fcdf4, #a9e2fa);
        transition: background 0.8s;
      }
      .is-autumn .season-sky {
        background: linear-gradient(#8fbde0, #c9dcea);
      }
      .is-winter .season-sky {
        background: linear-gradient(#b7cbdc, #e2ecf3);
      }
      .season-ground {
        left: 0;
        right: 0;
        bottom: 0;
        height: 5px;
        background: #7cc45a;
        transition: background 0.8s;
      }
      .is-summer .season-ground {
        background: #c9b85a;
      }
      .is-autumn .season-ground {
        background: #c08a3e;
      }
      .is-winter .season-ground {
        background: #f4f7fa;
      }
      .season-tree {
        left: 50%;
        bottom: 5px;
        width: 0;
        height: 0;
      }
      .season-tree .trunk {
        left: -2px;
        bottom: 0;
        width: 4px;
        height: 9px;
        background: #6b4a2b;
      }
      .season-tree .branches {
        left: -1px;
        bottom: 9px;
        width: 2px;
        height: 2px;
        background: #6b4a2b;
        box-shadow: -2px -2px 0 #6b4a2b, 2px -2px 0 #6b4a2b, -4px -4px 0 #6b4a2b, 4px -4px 0 #6b4a2b, 0 -4px 0 #6b4a2b, 0 -6px 0 #6b4a2b, -6px -6px 0 #6b4a2b, 6px -6px 0 #6b4a2b, -2px -8px 0 #6b4a2b, 2px -8px 0 #6b4a2b;
        opacity: 0;
        transition: opacity 0.6s;
      }
      .season-tree .crown {
        left: -8px;
        bottom: 7px;
        width: 16px;
        height: 13px;
        border-radius: 50% 50% 45% 45%;
        background: #8fd36a;
        box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.14);
        transition: background 0.8s, opacity 0.6s, transform 0.6s;
      }
      .is-summer .crown {
        background: #3f8f3a;
      }
      .is-autumn .crown {
        background: #e07a2a;
      }
      .is-winter .crown {
        opacity: 0;
        transform: scale(0.6);
      }
      .is-winter .branches {
        opacity: 1;
      }
      .season-tree .bloom {
        left: -6px;
        bottom: 12px;
        width: 2px;
        height: 2px;
        background: #ffb3c7;
        box-shadow: 5px -3px 0 #ffb3c7, 9px 1px 0 #ffb3c7, 3px 4px 0 #fff0f4, 10px -4px 0 #fff0f4;
        opacity: 0;
        transition: opacity 0.6s;
      }
      .is-spring .bloom {
        opacity: 1;
      }
      .season-tree .snowcap {
        left: -7px;
        bottom: 14px;
        width: 14px;
        height: 3px;
        border-radius: 2px;
        background: #ffffff;
        box-shadow: -2px 4px 0 -1px #ffffff, 4px 3px 0 -1px #ffffff;
        opacity: 0;
        transition: opacity 0.6s;
      }
      .is-winter .snowcap {
        opacity: 1;
      }

      /* A fan of chips spread from the middle of a button (see fan.js), one after another. */
      .fan {
        position: fixed;
        z-index: 11;
        width: 0;
        height: 0;
        pointer-events: none;
      }
      .fan-chip {
        position: absolute;
        left: 0;
        top: 0;
        bottom: auto;
        width: 34px;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
        transition:
          transform 0.32s cubic-bezier(0.34, 1.45, 0.5, 1),
          opacity 0.18s,
          box-shadow 0.15s;
        transition-delay: calc(var(--i) * 35ms);
      }
      .fan.is-open .fan-chip {
        pointer-events: auto;
        opacity: 1;
        transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(1);
      }
      .fan.is-open .fan-chip:hover {
        transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(1.08);
        transition-delay: 0s;
      }
      .fan.is-open .fan-chip:active {
        transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(0.96);
        transition-delay: 0s;
      }
      .fan-chip[aria-checked='true'] {
        box-shadow:
          0 0 0 2px var(--paper),
          0 0 0 3px rgba(43, 37, 51, 0.35),
          0 5px 12px rgba(43, 37, 51, 0.22);
      }
      .weather .live,
      .fan-chip .live {
        position: absolute;
        right: 5px;
        top: 5px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #4fd47a;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8);
        transition: opacity 0.4s;
      }
      .weather .live {
        opacity: 0;
      }
      .weather.is-real .live {
        opacity: 1;
        animation: weather-pulse 2s ease-in-out infinite;
      }
      .sky {
        position: absolute;
        inset: 0;
        display: block;
        background: linear-gradient(#7fcdf4, #a9e2fa);
        transition: background 0.6s;
      }
      .sky i {
        position: absolute;
        display: block;
        opacity: 0;
        transition: opacity 0.4s;
      }
      .sky .sun {
        left: 11px;
        top: 7px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffd23f 0 4px, transparent 4.5px),
          repeating-conic-gradient(#ffb703 0 15deg, transparent 15deg 45deg);
      }
      .sky .cloud {
        left: 9px;
        top: 14px;
        width: 10px;
        height: 5px;
        border-radius: 3px;
        background: #fff;
        box-shadow: 4px -3px 0 1px #fff, 8px 0 0 0 #fff;
      }
      .sky .drops {
        left: 12px;
        top: 17px;
        width: 2px;
        height: 4px;
        border-radius: 1px;
        background: #4fa3e8;
        box-shadow: 5px 1px 0 #4fa3e8, 10px -1px 0 #4fa3e8;
      }
      .sky .bolt {
        left: 15px;
        top: 17px;
        width: 7px;
        height: 11px;
        background: #ffd23f;
        clip-path: polygon(45% 0, 100% 0, 60% 42%, 95% 42%, 25% 100%, 40% 55%, 0 55%);
      }
      .sky .gusts {
        left: 7px;
        top: 11px;
        width: 14px;
        height: 2px;
        border-radius: 1px;
        background: #fff;
        box-shadow: 6px 5px 0 #fff, -2px 10px 0 #fff, 10px 10px 0 -0.5px #fff;
      }
      .sky-clear .sun {
        opacity: 1;
      }
      .sky-wind .gusts {
        opacity: 1;
      }
      .sky-wind {
        background: linear-gradient(#8fd3f2, #c2e8f8);
      }
      .sky-cloudy {
        background: linear-gradient(#93b5d2, #c3d4e2);
      }
      .sky-cloudy .cloud {
        opacity: 1;
        top: 11px;
      }
      .sky-rain,
      .sky-snow {
        background: linear-gradient(#7d93ad, #a7b9cb);
      }
      .sky-rain .cloud,
      .sky-snow .cloud {
        opacity: 1;
        top: 9px;
      }
      .sky-rain .drops {
        opacity: 1;
      }
      .sky-storm {
        background: linear-gradient(#3f4766, #6a7490);
      }
      .sky-storm .cloud {
        opacity: 1;
        top: 7px;
        background: #cfd4e0;
        box-shadow: 4px -3px 0 1px #cfd4e0, 8px 0 0 0 #cfd4e0;
      }
      .sky-storm .bolt {
        opacity: 1;
      }
      .sky-snow .drops {
        opacity: 1;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 5px 2px 0 #fff, 10px -1px 0 #fff;
      }
      /* After dark: the moon instead of the sun, night skies behind the clouds and the trees. */
      .sky .moon {
        left: 12px;
        top: 8px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 40%, #d9d3b8 0 1.5px, transparent 2px),
          radial-gradient(circle at 65% 68%, #d9d3b8 0 1px, transparent 1.5px), #fff6d5;
        box-shadow: 0 0 4px 1px rgba(255, 246, 213, 0.35);
      }
      .is-night .sky {
        background: linear-gradient(#1f2656, #3a4486);
      }
      .is-night .sky-cloudy,
      .is-night .sky-rain,
      .is-night .sky-snow {
        background: linear-gradient(#1a1f3a, #343b60);
      }
      .is-night .sky-storm {
        background: linear-gradient(#121527, #262c48);
      }
      .is-night .sky .sun {
        opacity: 0;
      }
      .is-night .sky-clear .moon {
        opacity: 1;
      }
      .is-night .sky .cloud {
        background: #b4bad0;
        box-shadow: 4px -3px 0 1px #b4bad0, 8px 0 0 0 #b4bad0;
      }
      .is-night .sky-storm .cloud {
        background: #8e95b0;
        box-shadow: 4px -3px 0 1px #8e95b0, 8px 0 0 0 #8e95b0;
      }
      .is-night .sky .gusts {
        background: #d6dcef;
        box-shadow: 6px 5px 0 #d6dcef, -2px 10px 0 #d6dcef, 10px 10px 0 -0.5px #d6dcef;
      }
      .is-night .season-sky {
        background: linear-gradient(#1f2656, #3a4486);
      }
      .is-night .season-ground {
        filter: brightness(0.55);
      }
      .is-night .season-tree {
        filter: brightness(0.7);
      }
      @keyframes weather-pulse {
        50% {
          box-shadow: 0 0 0 3px rgba(79, 212, 122, 0.3);
        }
      }
      /* While the island is built: the lighthouse on its rock at dusk, sweeping its beam over the
         sea. Building the map holds the page's thread for seconds, so everything here moves by
         transform and opacity alone, which the browser animates on its own while the script runs.
         main.js fades it out once the map has drawn its first frames. */
      .loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        background: linear-gradient(#1f2656 0%, #2e3878 30%, #5a5aa0 48%, #b98bb0 57%, #f1b98f 62%, #2f3f7c 62%, #1c2350 100%);
        transition: opacity 0.9s ease;
      }
      .loading.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .loading i,
      .loading svg {
        position: absolute;
        display: block;
      }
      .loading-stars {
        left: 0;
        top: 0;
        width: 2px;
        height: 2px;
        background: #fff6d5;
        animation: loading-twinkle 2.6s steps(2) infinite;
      }
      .loading-stars.a {
        box-shadow: 8vw 6vh #fff6d5, 21vw 14vh #fff6d5, 33vw 4vh #fff6d5, 47vw 19vh #fff6d5, 58vw 9vh #fff6d5, 66vw 27vh #fff6d5, 88vw 7vh #fff6d5, 94vw 23vh #fff6d5, 13vw 31vh #fff6d5, 39vw 33vh #fff6d5, 72vw 3vh #fff6d5;
      }
      .loading-stars.b {
        animation-delay: -1.3s;
        box-shadow: 4vw 18vh #fff6d5, 16vw 2vh #fff6d5, 27vw 24vh #fff6d5, 42vw 11vh #fff6d5, 53vw 29vh #fff6d5, 63vw 16vh #fff6d5, 81vw 34vh #fff6d5, 91vw 13vh #fff6d5, 25vw 38vh #e8dcff, 85vw 40vh #e8dcff, 7vw 42vh #e8dcff;
      }
      .loading-moon {
        right: 16vw;
        top: 12vh;
        width: 4vmin;
        height: 4vmin;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 40%, #e6dcc0 0 12%, transparent 14%), radial-gradient(circle at 64% 66%, #e6dcc0 0 9%, transparent 11%), #fff6d5;
        box-shadow: 0 0 2vmin 0.6vmin rgba(255, 246, 213, 0.3);
      }
      /* The sea, below the line where the pink of the dusk ends. */
      .loading-wave {
        left: -20vmin;
        right: -20vmin;
        height: 0.5vmin;
        background: repeating-linear-gradient(90deg, rgba(168, 210, 240, 0.45) 0 3vmin, transparent 3vmin 10vmin);
        animation: loading-swell 5s linear infinite;
      }
      .loading-wave.w1 {
        top: 65%;
      }
      .loading-wave.w2 {
        top: 71%;
        opacity: 0.8;
        animation-duration: 7s;
        animation-direction: reverse;
      }
      .loading-wave.w3 {
        top: 79%;
        opacity: 0.6;
        animation-duration: 4s;
      }
      .loading-wave.w4 {
        top: 90%;
        opacity: 0.4;
        animation-duration: 6s;
        animation-direction: reverse;
      }
      .loading-stage {
        position: absolute;
        left: 50%;
        bottom: calc(38% - 5.2vmin);
        width: 26vmin;
        height: 41.6vmin;
        margin-left: -13vmin;
      }
      .loading-stage svg {
        inset: 0;
        width: 100%;
        height: 100%;
        shape-rendering: crispEdges;
      }
      /* The beam: a wedge of light from the lantern that turns about the tower, so seen from the
         side it swings out to one side, narrows to the lantern and swings out to the other.
         Bright as it comes round toward us, pale as it passes behind. */
      .loading-beam {
        left: 50%;
        top: 23.4%;
        width: 75vw;
        height: 20vmin;
        margin-top: -10vmin;
        transform-origin: 0 50%;
        background: linear-gradient(90deg, rgba(255, 236, 170, 0.9), rgba(255, 236, 170, 0.35) 40%, rgba(255, 236, 170, 0) 85%);
        clip-path: polygon(0 47%, 100% 0, 100% 100%, 0 53%);
        animation:
          loading-turn 6s ease-in-out infinite,
          loading-beam 6s linear infinite;
      }
      .loading-glow {
        left: 50%;
        top: 23.4%;
        width: 10vmin;
        height: 10vmin;
        margin: -5vmin 0 0 -5vmin;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 240, 190, 0.95) 0 12%, rgba(246, 197, 79, 0.45) 30%, rgba(246, 197, 79, 0) 70%);
        animation: loading-flash 6s linear infinite;
      }
      /* The lantern's light trembling on the water under the rock. */
      .loading-glint {
        left: 50%;
        top: calc(62% + 5.5vmin);
        width: 5vmin;
        height: 18vh;
        margin-left: -2.5vmin;
        background: repeating-linear-gradient(rgba(246, 197, 79, 0.7) 0 0.5vmin, transparent 0.5vmin 2.2vmin);
        -webkit-mask-image: linear-gradient(#000, transparent);
        mask-image: linear-gradient(#000, transparent);
        animation: loading-flash 6s linear infinite;
      }
      .loading-boat {
        left: 22%;
        top: 66%;
        width: 9vmin;
        height: 6vmin;
        shape-rendering: crispEdges;
        animation: loading-bob 3.2s ease-in-out infinite;
      }
      .loading-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 6vh;
        text-align: center;
        color: var(--paper);
        text-shadow: 0 2px 8px rgba(28, 35, 80, 0.6);
      }
      .loading-caption strong {
        display: block;
        font-size: max(20px, 3.6vmin);
        letter-spacing: 0.06em;
      }
      .loading-caption span {
        display: block;
        margin-top: 0.6em;
        font-size: max(13px, 2vmin);
        opacity: 0.75;
      }
      .loading-caption b {
        font-weight: inherit;
        animation: loading-dot 1.5s steps(1) infinite;
      }
      .loading-caption b:nth-child(2) {
        animation-delay: 0.25s;
      }
      .loading-caption b:nth-child(3) {
        animation-delay: 0.5s;
      }
      @keyframes loading-turn {
        0%,
        100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(-1);
        }
      }
      @keyframes loading-beam {
        0%,
        50%,
        100% {
          opacity: 0.7;
        }
        25% {
          opacity: 1;
        }
        75% {
          opacity: 0.2;
        }
      }
      @keyframes loading-flash {
        0%,
        50%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        20%,
        30% {
          opacity: 0.8;
        }
        25% {
          opacity: 1;
          transform: scale(1.35);
        }
        75% {
          opacity: 0.35;
          transform: scale(0.9);
        }
      }
      @keyframes loading-twinkle {
        50% {
          opacity: 0.35;
        }
      }
      @keyframes loading-swell {
        to {
          transform: translateX(-10vmin);
        }
      }
      @keyframes loading-bob {
        0%,
        100% {
          transform: translateY(0) rotate(-3deg);
        }
        50% {
          transform: translateY(0.6vmin) rotate(3deg);
        }
      }
