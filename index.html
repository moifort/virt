<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>VIRT — Les Jardins de Sable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="preload" href="assets/loading/opening.jpg" as="image" />
    <style>
      :root {
        --ink: #2b2533;
        --paper: #f7ecd4;
        --red: #c9443c;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f8d3a8;
        font-family: 'Pixelify Sans', monospace;
        color: var(--ink);
        user-select: none;
        /* The page itself never zooms: pinching zooms the map (see main.js). */
        touch-action: none;
      }
      canvas {
        display: block;
        cursor: grab;
        image-rendering: pixelated;
      }
      canvas:active {
        cursor: grabbing;
      }

      /* The little controls along the bottom right: the weather (weather.js) and the season
         (season.js), each spreading a fan of choices, and the day / night switch (daynight.js), a
         strip of sky with the sun or the moon on it. Soft shadows lift them off the picture; no
         hard ink around them. */
      .daynight,
      .season,
      .weather,
      .fan-chip {
        position: fixed;
        bottom: 16px;
        z-index: 10;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 15px;
        overflow: hidden;
        background: none;
        box-shadow:
          0 1px 2px rgba(43, 37, 51, 0.18),
          0 5px 12px rgba(43, 37, 51, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          inset 0 -1px 0 rgba(43, 37, 51, 0.12);
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .daynight {
        right: 16px;
        width: 64px;
      }
      .season {
        right: 90px;
        width: 34px;
      }
      .weather {
        right: 134px;
        width: 34px;
      }
      .daynight:hover,
      .season:hover,
      .weather:hover,
      .fan-chip:hover {
        transform: translateY(-1px);
        box-shadow:
          0 2px 3px rgba(43, 37, 51, 0.16),
          0 8px 18px rgba(43, 37, 51, 0.26),
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          inset 0 -1px 0 rgba(43, 37, 51, 0.12);
      }
      .daynight:active,
      .season:active,
      .weather:active,
      .fan-chip:active {
        transform: translateY(1px);
        box-shadow:
          0 1px 1px rgba(43, 37, 51, 0.18),
          0 2px 5px rgba(43, 37, 51, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          inset 0 -1px 0 rgba(43, 37, 51, 0.12);
      }
      .daynight:focus-visible,
      .season:focus-visible,
      .weather:focus-visible,
      .fan-chip:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 2px;
      }
      .daynight i {
        position: absolute;
        display: block;
      }
      .daynight-sky {
        position: absolute;
        inset: 0;
        background: linear-gradient(#7fcdf4, #a9e2fa);
        transition: background 0.8s;
      }
      .is-night .daynight-sky {
        background: linear-gradient(#1f2656, #3a4486);
      }
      .daynight .star {
        width: 2px;
        height: 2px;
        background: #fff6d5;
        opacity: 0;
        transition: opacity 0.8s;
      }
      .is-night .star {
        opacity: 1;
        animation: daynight-twinkle 1.8s steps(2) infinite;
      }
      .daynight .cloud {
        width: 10px;
        height: 4px;
        background: #fff;
        box-shadow: 3px -2px 0 #fff, -2px 1px 0 #fff;
        transition: opacity 0.6s;
        animation: daynight-drift 5s ease-in-out infinite alternate;
      }
      .is-night .cloud {
        opacity: 0;
      }
      .daynight-knob {
        position: absolute;
        top: 2px;
        left: 3px;
        width: 22px;
        height: 22px;
        transition: left 0.5s cubic-bezier(0.5, 1.6, 0.4, 0.8);
      }
      .is-night .daynight-knob {
        left: 35px;
      }
      .daynight .sun,
      .daynight .moon {
        inset: 0;
        border-radius: 50%;
        transition: opacity 0.4s, transform 0.5s;
      }
      .daynight .sun {
        background: radial-gradient(circle, #ffd23f 0 6px, transparent 6.5px),
          repeating-conic-gradient(#ffb703 0 15deg, transparent 15deg 45deg);
        animation: daynight-spin 8s linear infinite;
      }
      .daynight .moon {
        inset: 4px;
        background: radial-gradient(circle at 35% 40%, #d9d3b8 0 2px, transparent 2.5px),
          radial-gradient(circle at 65% 68%, #d9d3b8 0 1.5px, transparent 2px), #fff6d5;
        opacity: 0;
        transform: rotate(-90deg) scale(0.4);
        animation: daynight-glow 2.4s ease-in-out infinite alternate;
      }
      .is-night .sun {
        opacity: 0;
        transform: rotate(90deg) scale(0.4);
      }
      .is-night .moon {
        opacity: 1;
        transform: none;
      }
      @keyframes daynight-spin {
        to {
          rotate: 360deg;
        }
      }
      @keyframes daynight-glow {
        from {
          box-shadow: 0 0 2px 1px rgba(255, 246, 213, 0.3);
        }
        to {
          box-shadow: 0 0 6px 2px rgba(255, 246, 213, 0.6);
        }
      }
      @keyframes daynight-twinkle {
        50% {
          opacity: 0.3;
        }
      }
      @keyframes daynight-drift {
        to {
          translate: -6px 0;
        }
      }

      .season-pic,
      .season-pic span,
      .season-pic i {
        position: absolute;
        display: block;
      }
      .season-pic {
        inset: 0;
      }
      .season-sky {
        inset: 0;
        background: linear-gradient(#7fcdf4, #a9e2fa);
        transition: background 0.8s;
      }
      .is-autumn .season-sky {
        background: linear-gradient(#8fbde0, #c9dcea);
      }
      .is-winter .season-sky {
        background: linear-gradient(#b7cbdc, #e2ecf3);
      }
      .season-ground {
        left: 0;
        right: 0;
        bottom: 0;
        height: 5px;
        background: #7cc45a;
        transition: background 0.8s;
      }
      .is-summer .season-ground {
        background: #c9b85a;
      }
      .is-autumn .season-ground {
        background: #c08a3e;
      }
      .is-winter .season-ground {
        background: #f4f7fa;
      }
      .season-tree {
        left: 50%;
        bottom: 5px;
        width: 0;
        height: 0;
      }
      .season-tree .trunk {
        left: -2px;
        bottom: 0;
        width: 4px;
        height: 9px;
        background: #6b4a2b;
      }
      .season-tree .branches {
        left: -1px;
        bottom: 9px;
        width: 2px;
        height: 2px;
        background: #6b4a2b;
        box-shadow: -2px -2px 0 #6b4a2b, 2px -2px 0 #6b4a2b, -4px -4px 0 #6b4a2b, 4px -4px 0 #6b4a2b, 0 -4px 0 #6b4a2b, 0 -6px 0 #6b4a2b, -6px -6px 0 #6b4a2b, 6px -6px 0 #6b4a2b, -2px -8px 0 #6b4a2b, 2px -8px 0 #6b4a2b;
        opacity: 0;
        transition: opacity 0.6s;
      }
      .season-tree .crown {
        left: -8px;
        bottom: 7px;
        width: 16px;
        height: 13px;
        border-radius: 50% 50% 45% 45%;
        background: #8fd36a;
        box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.14);
        transition: background 0.8s, opacity 0.6s, transform 0.6s;
      }
      .is-summer .crown {
        background: #3f8f3a;
      }
      .is-autumn .crown {
        background: #e07a2a;
      }
      .is-winter .crown {
        opacity: 0;
        transform: scale(0.6);
      }
      .is-winter .branches {
        opacity: 1;
      }
      .season-tree .bloom {
        left: -6px;
        bottom: 12px;
        width: 2px;
        height: 2px;
        background: #ffb3c7;
        box-shadow: 5px -3px 0 #ffb3c7, 9px 1px 0 #ffb3c7, 3px 4px 0 #fff0f4, 10px -4px 0 #fff0f4;
        opacity: 0;
        transition: opacity 0.6s;
      }
      .is-spring .bloom {
        opacity: 1;
      }
      .season-tree .snowcap {
        left: -7px;
        bottom: 14px;
        width: 14px;
        height: 3px;
        border-radius: 2px;
        background: #ffffff;
        box-shadow: -2px 4px 0 -1px #ffffff, 4px 3px 0 -1px #ffffff;
        opacity: 0;
        transition: opacity 0.6s;
      }
      .is-winter .snowcap {
        opacity: 1;
      }

      /* A fan of chips spread from the middle of a button (see fan.js), one after another. */
      .fan {
        position: fixed;
        z-index: 11;
        width: 0;
        height: 0;
        pointer-events: none;
      }
      .fan-chip {
        position: absolute;
        left: 0;
        top: 0;
        bottom: auto;
        width: 34px;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
        transition:
          transform 0.32s cubic-bezier(0.34, 1.45, 0.5, 1),
          opacity 0.18s,
          box-shadow 0.15s;
        transition-delay: calc(var(--i) * 35ms);
      }
      .fan.is-open .fan-chip {
        pointer-events: auto;
        opacity: 1;
        transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(1);
      }
      .fan.is-open .fan-chip:hover {
        transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(1.08);
        transition-delay: 0s;
      }
      .fan.is-open .fan-chip:active {
        transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(0.96);
        transition-delay: 0s;
      }
      .fan-chip[aria-checked='true'] {
        box-shadow:
          0 0 0 2px var(--paper),
          0 0 0 3px rgba(43, 37, 51, 0.35),
          0 5px 12px rgba(43, 37, 51, 0.22);
      }
      .weather .live,
      .fan-chip .live {
        position: absolute;
        right: 5px;
        top: 5px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #4fd47a;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8);
        transition: opacity 0.4s;
      }
      .weather .live {
        opacity: 0;
      }
      .weather.is-real .live {
        opacity: 1;
        animation: weather-pulse 2s ease-in-out infinite;
      }
      .sky {
        position: absolute;
        inset: 0;
        display: block;
        background: linear-gradient(#7fcdf4, #a9e2fa);
        transition: background 0.6s;
      }
      .sky i {
        position: absolute;
        display: block;
        opacity: 0;
        transition: opacity 0.4s;
      }
      .sky .sun {
        left: 11px;
        top: 7px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffd23f 0 4px, transparent 4.5px),
          repeating-conic-gradient(#ffb703 0 15deg, transparent 15deg 45deg);
      }
      .sky .cloud {
        left: 9px;
        top: 14px;
        width: 10px;
        height: 5px;
        border-radius: 3px;
        background: #fff;
        box-shadow: 4px -3px 0 1px #fff, 8px 0 0 0 #fff;
      }
      .sky .drops {
        left: 12px;
        top: 17px;
        width: 2px;
        height: 4px;
        border-radius: 1px;
        background: #4fa3e8;
        box-shadow: 5px 1px 0 #4fa3e8, 10px -1px 0 #4fa3e8;
      }
      .sky .bolt {
        left: 15px;
        top: 17px;
        width: 7px;
        height: 11px;
        background: #ffd23f;
        clip-path: polygon(45% 0, 100% 0, 60% 42%, 95% 42%, 25% 100%, 40% 55%, 0 55%);
      }
      .sky .gusts {
        left: 7px;
        top: 11px;
        width: 14px;
        height: 2px;
        border-radius: 1px;
        background: #fff;
        box-shadow: 6px 5px 0 #fff, -2px 10px 0 #fff, 10px 10px 0 -0.5px #fff;
      }
      .sky-clear .sun {
        opacity: 1;
      }
      .sky-wind .gusts {
        opacity: 1;
      }
      .sky-wind {
        background: linear-gradient(#8fd3f2, #c2e8f8);
      }
      .sky-cloudy {
        background: linear-gradient(#93b5d2, #c3d4e2);
      }
      .sky-cloudy .cloud {
        opacity: 1;
        top: 11px;
      }
      .sky-rain,
      .sky-snow {
        background: linear-gradient(#7d93ad, #a7b9cb);
      }
      .sky-rain .cloud,
      .sky-snow .cloud {
        opacity: 1;
        top: 9px;
      }
      .sky-rain .drops {
        opacity: 1;
      }
      .sky-storm {
        background: linear-gradient(#3f4766, #6a7490);
      }
      .sky-storm .cloud {
        opacity: 1;
        top: 7px;
        background: #cfd4e0;
        box-shadow: 4px -3px 0 1px #cfd4e0, 8px 0 0 0 #cfd4e0;
      }
      .sky-storm .bolt {
        opacity: 1;
      }
      .sky-snow .drops {
        opacity: 1;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 5px 2px 0 #fff, 10px -1px 0 #fff;
      }
      /* After dark: the moon instead of the sun, night skies behind the clouds and the trees. */
      .sky .moon {
        left: 12px;
        top: 8px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 40%, #d9d3b8 0 1.5px, transparent 2px),
          radial-gradient(circle at 65% 68%, #d9d3b8 0 1px, transparent 1.5px), #fff6d5;
        box-shadow: 0 0 4px 1px rgba(255, 246, 213, 0.35);
      }
      .is-night .sky {
        background: linear-gradient(#1f2656, #3a4486);
      }
      .is-night .sky-cloudy,
      .is-night .sky-rain,
      .is-night .sky-snow {
        background: linear-gradient(#1a1f3a, #343b60);
      }
      .is-night .sky-storm {
        background: linear-gradient(#121527, #262c48);
      }
      .is-night .sky .sun {
        opacity: 0;
      }
      .is-night .sky-clear .moon {
        opacity: 1;
      }
      .is-night .sky .cloud {
        background: #b4bad0;
        box-shadow: 4px -3px 0 1px #b4bad0, 8px 0 0 0 #b4bad0;
      }
      .is-night .sky-storm .cloud {
        background: #8e95b0;
        box-shadow: 4px -3px 0 1px #8e95b0, 8px 0 0 0 #8e95b0;
      }
      .is-night .sky .gusts {
        background: #d6dcef;
        box-shadow: 6px 5px 0 #d6dcef, -2px 10px 0 #d6dcef, 10px 10px 0 -0.5px #d6dcef;
      }
      .is-night .season-sky {
        background: linear-gradient(#1f2656, #3a4486);
      }
      .is-night .season-ground {
        filter: brightness(0.55);
      }
      .is-night .season-tree {
        filter: brightness(0.7);
      }
      @keyframes weather-pulse {
        50% {
          box-shadow: 0 0 0 3px rgba(79, 212, 122, 0.3);
        }
      }
      /* While the island is built: the arrival. The view the map opens on lies blurred under
         a sea of pixel clouds, as from a plane coming in over them, with a title card and a
         small loader. Building the map holds the page's thread for seconds, so everything
         here moves by transform and opacity only, which the browser animates on its own while
         the script runs: the clouds drift (an animation on the outer element). Once the map
         has drawn its first frames main.js adds `is-done`: the plane comes down through the
         clouds, which swell, part and slip off the sides (a transition on the inner element,
         composed with the drift so nothing jumps), while the shot comes into focus and fades
         on the map beneath. The shot is wider than any window and cropped at the sides as the
         map is, so it lies exactly over it (see shoot.js); the clouds are drawn by the script
         at the foot of the page. */
      .loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        background: #9ccbf0;
        transition: opacity 2.6s ease-in-out 1.4s;
      }
      .loading img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(12px) saturate(1.1);
        transform: scale(1.08);
        transition:
          filter 3s ease-in-out 0.5s,
          transform 3s ease-in-out 0.5s;
      }
      .loading.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .loading.is-done img {
        filter: blur(0) saturate(1);
        transform: none;
      }
      /* The morning light over the clouds, from the upper left. */
      .loading-light {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 60% 50% at 18% 8%, rgba(255, 244, 214, 0.5), rgba(255, 244, 214, 0) 100%);
        transition: opacity 1.6s ease-in-out;
      }
      /* Each cloud is drawn pixel by pixel on a small canvas and enlarged with nearest
         sampling, as the map itself is. `--x` and `--y` set it on the screen, `--ax` / `--ay`
         the way it goes when the plane comes down through it, `--i` its turn. */
      .loading-cloud {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: 0;
        height: 0;
        animation: loading-drift var(--drift) ease-in-out infinite alternate;
        animation-delay: var(--phase);
      }
      .loading-cloud canvas {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
        image-rendering: pixelated;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 6px 14px rgba(43, 60, 110, 0.18));
        transition:
          transform 3.4s cubic-bezier(0.5, 0, 0.75, 0.6),
          opacity 2s ease-in 1s;
        transition-delay: calc(var(--i) * 70ms), calc(1s + var(--i) * 70ms);
      }
      .loading.is-done .loading-cloud canvas {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--ax), var(--ay)) scale(2.4);
      }
      .loading.is-done .loading-light {
        opacity: 0;
      }
      @keyframes loading-drift {
        from {
          transform: translate(-2.4vw, 0.4vh);
        }
        to {
          transform: translate(2.4vw, -0.4vh);
        }
      }
      .loading-caption {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        color: var(--paper);
        letter-spacing: 0.08em;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.25),
          0 3px 14px rgba(28, 35, 80, 0.5);
        transition: opacity 0.7s ease, transform 0.9s ease;
      }
      .loading-title {
        font-size: max(26px, 5.2vmin);
        font-weight: 700;
        line-height: 1;
      }
      .loading-sub {
        font-size: max(12px, 1.7vmin);
        letter-spacing: 0.34em;
        opacity: 0.85;
        margin-top: -6px;
      }
      .loading.is-done .loading-caption {
        opacity: 0;
        transform: translateY(-10px);
      }
      /* Eight squares round a ring, lit one after the other. */
      .loading-spinner {
        display: grid;
        grid-template: repeat(3, 6px) / repeat(3, 6px);
        gap: 2px;
        margin-top: 6px;
        filter: drop-shadow(0 1px 3px rgba(28, 35, 80, 0.5));
      }
      .loading-spinner i {
        background: var(--paper);
        animation: loading-chase 0.96s linear infinite;
      }
      .loading-spinner i:nth-child(1) { grid-area: 1 / 1; animation-delay: -0.84s; }
      .loading-spinner i:nth-child(2) { grid-area: 1 / 2; animation-delay: -0.72s; }
      .loading-spinner i:nth-child(3) { grid-area: 1 / 3; animation-delay: -0.6s; }
      .loading-spinner i:nth-child(4) { grid-area: 2 / 3; animation-delay: -0.48s; }
      .loading-spinner i:nth-child(5) { grid-area: 3 / 3; animation-delay: -0.36s; }
      .loading-spinner i:nth-child(6) { grid-area: 3 / 2; animation-delay: -0.24s; }
      .loading-spinner i:nth-child(7) { grid-area: 3 / 1; animation-delay: -0.12s; }
      .loading-spinner i:nth-child(8) { grid-area: 2 / 1; animation-delay: 0s; }
      @keyframes loading-chase {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0.15;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading *,
        .weather *,
        .fan-chip,
        .season *,
        .season,
        .daynight *,
        .daynight {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="loading" id="loading" role="status" aria-label="Chargement">
      <img src="assets/loading/opening.jpg" alt="" />
      <div class="loading-light"></div>
      <div class="loading-sky" aria-hidden="true"></div>
      <div class="loading-caption">
        <span class="loading-title">Les Jardins de Sable</span>
        <span class="loading-sub">VIRT</span>
        <span class="loading-spinner" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
    <script>
      // The sea of clouds of the loading screen, drawn before the map's script is fetched. Each
      // cloud is a cumulus heaped from a flat base, rasterised pixel by pixel on a small canvas
      // in the three tones of the clouds painted in the game's sky: sunlit crowns to the upper
      // left, the white body, the blue-lavender shade of the hollows and the underside. The
      // canvas is then enlarged with nearest sampling, and sent off outward from the middle of
      // the screen when the plane comes down through the layer (see the styles above).
      (() => {
        const sky = document.querySelector('.loading-sky');
        let seed = 7;
        const rand = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
        const CROWN = [255, 255, 255];
        const BODY = [234, 241, 252];
        const SHADE = [188, 202, 234];
        const draw = (width) => {
          const height = Math.round(width * 0.42);
          const base = height - 4;
          // Puffs heaped along the base, the tallest about the middle.
          const puffs = [];
          const count = 4 + Math.floor(width / 24);
          for (let i = 0; i < count; i++) {
            const t = (i + 0.5) / count;
            const r = (0.14 + 0.2 * Math.sin(t * Math.PI) + rand() * 0.12) * width * 0.5;
            puffs.push([t * width + (rand() - 0.5) * 8, base - r * (0.75 + rand() * 0.35), r]);
          }
          const inside = (x, y) => y < base && puffs.some(([cx, cy, r]) => (x - cx) * (x - cx) + (y - cy) * (y - cy) < r * r);
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ink = canvas.getContext('2d');
          const image = ink.createImageData(width, height);
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              if (!inside(x, y)) continue;
              const tone = !inside(x - 3, y - 4) ? CROWN : !inside(x + 2, y + 4) || y > base - 3 ? SHADE : BODY;
              image.data.set([...tone, 255], (y * width + x) * 4);
            }
          }
          ink.putImageData(image, 0, 0);
          return canvas;
        };
        // A dozen clouds about the screen, the big ones nearest, each going off from the middle.
        // They are enlarged with the window, so that a wide screen is as well covered as a small one.
        const grow = Math.min(Math.max(innerWidth / 900, 1), 2);
        const spots = [
          [8, 14, 5], [30, 6, 4], [55, 10, 6], [82, 8, 4.5], [96, 30, 5],
          [12, 44, 4], [40, 38, 3], [70, 42, 3.5], [90, 60, 4],
          [6, 80, 6], [28, 90, 5], [52, 78, 4], [76, 92, 6], [98, 88, 4],
        ];
        spots.forEach(([x, y, s], i) => {
          const cloud = document.createElement('div');
          cloud.className = 'loading-cloud';
          const ax = (x - 50) * 1.6;
          const ay = (y - 50) * 1.6;
          cloud.style.cssText = `--x:${x}%;--y:${y}%;--i:${i};--ax:${ax}vw;--ay:${ay}vh;--drift:${34 + rand() * 24}s;--phase:${-rand() * 40}s`;
          const canvas = draw(48 + Math.floor(rand() * 60));
          // Enlarged by its style, not by a transform, so that it is drawn crisp while at rest.
          canvas.style.width = `${canvas.width * s * grow}px`;
          canvas.style.height = `${canvas.height * s * grow}px`;
          cloud.append(canvas);
          sky.append(cloud);
        });
      })();
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
