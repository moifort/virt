<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Les Jardins de Sable</title>
    <style>
      :root {
        --ink: #2a1f3d;
        --paper: #f3ead6;
        --saffron: #f6c54f;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        font-family: 'Avenir Next Condensed', 'Futura', 'Helvetica Neue', sans-serif;
        color: var(--ink);
        user-select: none;
      }
      canvas {
        display: block;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      /* Printed-page feel: grain + vignette over the render. */
      #paper {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at center, transparent 55%, rgba(42, 31, 61, 0.28)),
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
        mix-blend-mode: multiply;
        opacity: 0.35;
      }
      .panel {
        position: fixed;
        background: var(--paper);
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        padding: 8px 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #title {
        top: 18px;
        left: 18px;
        font-weight: 800;
        font-size: 20px;
      }
      #title small {
        display: block;
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 0.2em;
        opacity: 0.7;
      }
      #seeds {
        top: 18px;
        right: 18px;
        font-weight: 700;
        font-size: 16px;
      }
      #seeds b {
        color: #c9443c;
        font-size: 22px;
      }
      #compass {
        top: 76px;
        right: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }
      #compass.hidden {
        display: none;
      }
      #arrow {
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 18px solid #c9443c;
        transform-origin: 50% 60%;
      }
      #toast {
        left: 50%;
        top: 22%;
        transform: translate(-50%, -10px);
        opacity: 0;
        transition:
          opacity 0.4s,
          transform 0.4s;
        font-weight: 700;
        font-size: 17px;
        text-align: center;
        max-width: 70vw;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #help {
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="paper"></div>
    <div id="title" class="panel">Les Jardins de Sable<small>prototype open world</small></div>
    <div id="seeds" class="panel">Graines <b id="count">0</b> / <span id="total">6</span></div>
    <div id="compass" class="panel"><div id="arrow"></div><span id="dist"></span></div>
    <div id="toast" class="panel"></div>
    <div id="help" class="panel">
      ZQSD / WASD bouger · Maj courir · Espace sauter · Glisser : caméra · Molette : zoom
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
