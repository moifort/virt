<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>VIRT — Les Jardins de Sable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2b2533;
        --paper: #f7ecd4;
        --red: #c9443c;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f8d3a8;
        font-family: 'Pixelify Sans', monospace;
        color: var(--ink);
        user-select: none;
        /* The page itself never zooms: pinching zooms the map (see main.js). */
        touch-action: none;
      }
      canvas {
        display: block;
        cursor: grab;
        image-rendering: pixelated;
      }
      canvas:active {
        cursor: grabbing;
      }

      /* The day / night switch (see daynight.js): a strip of sky with the sun or the moon on it. */
      .daynight {
        position: fixed;
        top: 12px;
        left: 50%;
        z-index: 10;
        width: 64px;
        height: 30px;
        padding: 0;
        border: 2px solid var(--ink);
        border-radius: 15px;
        overflow: hidden;
        background: none;
        box-shadow: 0 3px 0 var(--ink);
        cursor: pointer;
        transform: translateX(-50%);
        transition: transform 0.12s, box-shadow 0.12s;
      }
      .daynight:hover {
        transform: translate(-50%, -1px);
        box-shadow: 0 4px 0 var(--ink);
      }
      .daynight:active {
        transform: translate(-50%, 2px);
        box-shadow: 0 1px 0 var(--ink);
      }
      .daynight:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 2px;
      }
      .daynight i {
        position: absolute;
        display: block;
      }
      .daynight-sky {
        position: absolute;
        inset: 0;
        background: #8fd6f6;
        transition: background 0.8s;
      }
      .is-night .daynight-sky {
        background: #27306a;
      }
      .daynight .star {
        width: 2px;
        height: 2px;
        background: #fff6d5;
        opacity: 0;
        transition: opacity 0.8s;
      }
      .is-night .star {
        opacity: 1;
        animation: daynight-twinkle 1.8s steps(2) infinite;
      }
      .daynight .cloud {
        width: 10px;
        height: 4px;
        background: #fff;
        box-shadow: 3px -2px 0 #fff, -2px 1px 0 #fff;
        transition: opacity 0.6s;
        animation: daynight-drift 5s ease-in-out infinite alternate;
      }
      .is-night .cloud {
        opacity: 0;
      }
      .daynight-knob {
        position: absolute;
        top: 2px;
        left: 3px;
        width: 22px;
        height: 22px;
        transition: left 0.5s cubic-bezier(0.5, 1.6, 0.4, 0.8);
      }
      .is-night .daynight-knob {
        left: 35px;
      }
      .daynight .sun,
      .daynight .moon {
        inset: 0;
        border-radius: 50%;
        transition: opacity 0.4s, transform 0.5s;
      }
      .daynight .sun {
        background: radial-gradient(circle, #ffd23f 0 6px, transparent 6.5px),
          repeating-conic-gradient(#ffb703 0 15deg, transparent 15deg 45deg);
        animation: daynight-spin 8s linear infinite;
      }
      .daynight .moon {
        inset: 4px;
        background: radial-gradient(circle at 35% 40%, #d9d3b8 0 2px, transparent 2.5px),
          radial-gradient(circle at 65% 68%, #d9d3b8 0 1.5px, transparent 2px), #fff6d5;
        opacity: 0;
        transform: rotate(-90deg) scale(0.4);
        animation: daynight-glow 2.4s ease-in-out infinite alternate;
      }
      .is-night .sun {
        opacity: 0;
        transform: rotate(90deg) scale(0.4);
      }
      .is-night .moon {
        opacity: 1;
        transform: none;
      }
      @keyframes daynight-spin {
        to {
          rotate: 360deg;
        }
      }
      @keyframes daynight-glow {
        from {
          box-shadow: 0 0 2px 1px rgba(255, 246, 213, 0.3);
        }
        to {
          box-shadow: 0 0 6px 2px rgba(255, 246, 213, 0.6);
        }
      }
      @keyframes daynight-twinkle {
        50% {
          opacity: 0.3;
        }
      }
      @keyframes daynight-drift {
        to {
          translate: -6px 0;
        }
      }

      /* The season switch (see season.js): a tree beside the sky strip, turning with the year. */
      .season {
        position: fixed;
        top: 12px;
        left: calc(50% + 40px);
        z-index: 10;
        width: 34px;
        height: 30px;
        padding: 0;
        border: 2px solid var(--ink);
        border-radius: 15px;
        overflow: hidden;
        background: none;
        box-shadow: 0 3px 0 var(--ink);
        cursor: pointer;
        transition: transform 0.12s, box-shadow 0.12s;
      }
      .season:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 0 var(--ink);
      }
      .season:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 var(--ink);
      }
      .season:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 2px;
      }
      .season span,
      .season i {
        position: absolute;
        display: block;
      }
      .season-sky {
        inset: 0;
        background: #8fd6f6;
        transition: background 0.8s;
      }
      .is-autumn .season-sky {
        background: #9fc8e8;
      }
      .is-winter .season-sky {
        background: #c4d6e6;
      }
      .season-ground {
        left: 0;
        right: 0;
        bottom: 0;
        height: 5px;
        background: #7cc45a;
        transition: background 0.8s;
      }
      .is-summer .season-ground {
        background: #c9b85a;
      }
      .is-autumn .season-ground {
        background: #c08a3e;
      }
      .is-winter .season-ground {
        background: #f4f7fa;
      }
      .season-tree {
        left: 50%;
        bottom: 5px;
        width: 0;
        height: 0;
      }
      .season .trunk {
        left: -2px;
        bottom: 0;
        width: 4px;
        height: 9px;
        background: #6b4a2b;
      }
      .season .branches {
        left: -1px;
        bottom: 9px;
        width: 2px;
        height: 2px;
        background: #6b4a2b;
        box-shadow: -2px -2px 0 #6b4a2b, 2px -2px 0 #6b4a2b, -4px -4px 0 #6b4a2b, 4px -4px 0 #6b4a2b, 0 -4px 0 #6b4a2b, 0 -6px 0 #6b4a2b, -6px -6px 0 #6b4a2b, 6px -6px 0 #6b4a2b, -2px -8px 0 #6b4a2b, 2px -8px 0 #6b4a2b;
        opacity: 0;
        transition: opacity 0.6s;
      }
      .season .crown {
        left: -8px;
        bottom: 7px;
        width: 16px;
        height: 13px;
        border-radius: 50% 50% 45% 45%;
        background: #8fd36a;
        box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.14);
        transition: background 0.8s, opacity 0.6s, transform 0.6s;
      }
      .is-summer .crown {
        background: #3f8f3a;
      }
      .is-autumn .crown {
        background: #e07a2a;
      }
      .is-winter .crown {
        opacity: 0;
        transform: scale(0.6);
      }
      .is-winter .branches {
        opacity: 1;
      }
      .season .bloom {
        left: -6px;
        bottom: 12px;
        width: 2px;
        height: 2px;
        background: #ffb3c7;
        box-shadow: 5px -3px 0 #ffb3c7, 9px 1px 0 #ffb3c7, 3px 4px 0 #fff0f4, 10px -4px 0 #fff0f4;
        opacity: 0;
        transition: opacity 0.6s;
      }
      .is-spring .bloom {
        opacity: 1;
      }
      .season .snowcap {
        left: -7px;
        bottom: 14px;
        width: 14px;
        height: 3px;
        border-radius: 2px;
        background: #ffffff;
        box-shadow: -2px 4px 0 -1px #ffffff, 4px 3px 0 -1px #ffffff;
        opacity: 0;
        transition: opacity 0.6s;
      }
      .is-winter .snowcap {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .season *,
        .season,
        .daynight *,
        .daynight {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
