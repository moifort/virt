<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIRT — Les Jardins de Sable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2b2533;
        --paper: #f7ecd4;
        --red: #c9443c;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f8d3a8;
        font-family: 'Pixelify Sans', monospace;
        color: var(--ink);
        user-select: none;
      }
      canvas {
        display: block;
        cursor: grab;
        image-rendering: pixelated;
      }
      canvas:active {
        cursor: grabbing;
      }
      .panel {
        position: fixed;
        background: var(--paper);
        border: 3px solid var(--ink);
        box-shadow: 3px 3px 0 var(--ink);
        padding: 6px 12px;
      }
      #title {
        top: 15px;
        left: 15px;
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 0.04em;
      }
      #title small {
        display: block;
        font-weight: 400;
        font-size: 13px;
        color: var(--red);
      }
      #help {
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        white-space: nowrap;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="title" class="panel">VIRT · Les Jardins de Sable<small>espace de travail virtuel</small></div>
    <div id="help" class="panel">ZQSD bouger · Maj courir · Espace sauter · A / E pivoter · glisser : caméra · molette : zoom</div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
